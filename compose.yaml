name: app-with-volumes
services:
  app:
    build: .
    ports:
      - ${HOST_PORT}:8000
    environment:
      - PORT=8000
      - GREETING=${GREETING}
      - STORAGE=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('https://127/0/0/1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
  redis:
    image: redis:7.4-alpine
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
volumes:
  data: